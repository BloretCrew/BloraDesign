<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选择器 · Blora Design</title>
    <link rel="stylesheet" href="../../packages/blora-design/dist/blora.css" />
    <script type="module" src="../../packages/blora-design/dist/blora.js"></script>
  </head>
  <body>
    <main class="bd-page" style="max-width: 1200px; margin: 12px auto; padding: 0 12px">
      <section class="bd-mosaic" data-cols="3">
        <article class="bd-tile">
          <header class="bd-head">
            <h2>单选</h2>
            <p>零原生 &lt;select&gt;</p>
          </header>
          <div class="bd-select" id="single">
            <button type="button" data-part="trigger" aria-label="区域">
              <span data-part="value"></span>
              <svg data-icon width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div data-part="panel" popover>
              <div role="listbox" aria-label="区域">
                <div role="option" data-value="ap-hk-01" aria-selected="true">
                  亚太香港星轨区 (ap-hk-01)
                </div>
                <div role="option" data-value="ap-sg-02">新加坡边缘扇区 (ap-sg-02)</div>
                <div role="option" data-value="ap-tyo-02">东京低延迟扇区 (ap-tyo-02)</div>
                <div role="option" data-value="eu-fra-01">法兰克福中继环 (eu-fra-01)</div>
              </div>
            </div>
            <input type="hidden" name="region" />
          </div>
        </article>
        <article class="bd-tile">
          <header class="bd-head">
            <h2>可搜索多选</h2>
            <p>相邻选中自动融为一体</p>
          </header>
          <div class="bd-select" id="multi" data-placeholder="点击选择挂载模块...">
            <button type="button" data-part="trigger" aria-label="挂载模块">
              <span data-part="value"></span>
              <svg data-icon width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div data-part="panel" popover>
              <input data-part="search" placeholder="搜索挂载模块..." aria-label="搜索挂载模块" />
              <div role="listbox" aria-multiselectable="true" aria-label="挂载模块">
                <div role="option" data-value="panel" aria-selected="true">核心控制台</div>
                <div role="option" data-value="hub" aria-selected="true">门户站点</div>
                <div role="option" data-value="pass">统一鉴权</div>
                <div role="option" data-value="tunnel" aria-selected="true">流量加速</div>
                <div role="option" data-value="snap">自动冷备环</div>
              </div>
              <p data-part="empty">没有匹配的模块</p>
            </div>
            <input type="hidden" name="modules" />
          </div>
        </article>
        <article class="bd-tile">
          <header class="bd-head">
            <h2>日期</h2>
            <p>起止日期连成胶囊带</p>
          </header>
          <div class="bd-date" data-mode="range" data-value="2026-11-18/2026-11-21" id="date">
            <button type="button" data-part="trigger" aria-label="时间窗口">
              <span data-part="value">
                <svg data-icon width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 2v4" />
                  <path d="M16 2v4" />
                  <rect width="18" height="18" x="3" y="4" rx="2" />
                  <path d="M3 10h18" />
                </svg>
                <span data-part="text"></span>
              </span>
              <span class="bd-pill" data-tone="sand" data-part="badge"></span>
            </button>
            <div data-part="panel" popover></div>
            <input type="hidden" name="window" />
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
