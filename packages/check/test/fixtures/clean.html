<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../blora-design/dist/blora.css" />
    <script type="module" src="../../../blora-design/dist/blora.js"></script>
    <title>通过</title>

  <body>
    <main class="bd-page">
      <section class="bd-mosaic" data-cols="2">

            <h2>实例</h2>

          </header>
          <ul class="bd-tray">
            <li class="bd-item">
              <div><strong>web-edge-03</strong><small>ap-sg-02</small></div>

            </li>
            <li class="bd-item">
              <div><strong>api-gateway</strong><small>ap-hk-01</small></div>

            </li>
            <li class="bd-item">
              <div><strong>worker-02</strong><small>eu-fra-01</small></div>

            </li>
          </ul>
        </article>
        <article class="bd-tile">
          <header class="bd-head">
            <h2>区域</h2>
            <p>实例数量</p>
          </header>
          <ul class="bd-tray">
            <li class="bd-item">
              <div><strong>亚太 · 香港</strong><small>ap-hk-01</small></div>

            <li class="bd-item">
              <div><strong>亚太 · 新加坡</strong><small>ap-sg-02</small></div>
              <span data-part="end">6 台</span>
            </li>
            <li class="bd-item">
              <div><strong>欧洲 · 法兰克福</strong><small>eu-fra-01</small></div>
              <span data-part="end">2 台</span>

          </ul>

      </section>

</html>
