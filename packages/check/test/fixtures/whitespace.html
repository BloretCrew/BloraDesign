<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../blora-design/dist/blora.css" />
    <script type="module" src="../../../blora-design/dist/blora.js"></script>
    <title>空白</title>
  </head>
  <body>
    <main class="bd-page">
      <section class="bd-mosaic" data-cols="2">
        <article class="bd-tile">
          <header class="bd-head"><h2>很长的格子</h2></header>
          <ul class="bd-tray">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
            <li>8</li>
          </ul>
        </article>
        <article class="bd-tile">
          <header class="bd-head"><h2>很短的格子</h2></header>
          <p>只有一行字，被同一行的长格子撑高，下面留出一大片空白。</p>
        </article>
      </section>
    </main>
  </body>
</html>
