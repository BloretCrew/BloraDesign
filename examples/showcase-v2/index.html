<!doctype html>
<html lang="zh-CN" data-blora-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f8" />
    <title>Accordion · Blora Design Components</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("blora-color-scheme");
          const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.bloraColorScheme = saved || preferred;
        } catch {
          document.documentElement.dataset.bloraColorScheme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="../../packages/blora-design/dist/blora.css" />
    <link rel="stylesheet" href="../../packages/blora-design/dist/tokens.dark.css" />
    <link rel="stylesheet" href="../../packages/blora-design/dist/tokens.themes.css" />
    <link rel="stylesheet" href="../../addons/theming/dist/theming.css" />
    <link rel="stylesheet" href="../../addons/layout/dist/layout.css" />
    <link rel="stylesheet" href="../../addons/effects/dist/effects.css" />
    <link rel="stylesheet" href="../../addons/markdown/dist/markdown.css" />
    <link rel="stylesheet" href="../../addons/qrcode/dist/qrcode.css" />
    <link rel="stylesheet" href="../../addons/thread/dist/thread.css" />
    <style>
      :root {
        --showcase-navbar-offset: 6rem;
      }

      /* Hide unstamped hosts before BloraElement's parser-defer render. */
      blora-dialog:not([open]),
      blora-drawer:not([open], [data-open]),
      blora-tabs > blora-tab:not([selected]) {
        display: none;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-padding-top: var(--showcase-navbar-offset);
      }

      body {
        min-width: 20rem;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      /* Showcase owns only page composition. Visual component chrome comes
         from the official Navbar, Layout, Tabs, Badge and Button CSS above. */
      .showcase-navbar {
        z-index: var(--blora-z-sticky);
      }

      .showcase-catalog {
        --blora-sidebar-width: 15rem;
        --blora-sidebar-min-height: calc(100dvh - var(--showcase-navbar-offset));
        --blora-sidebar-aside-padding: 0 var(--blora-space-5) var(--blora-space-6) 0;
        --blora-sidebar-aside-background: transparent;
        --blora-sidebar-content-padding: 0 0 var(--blora-space-12)
          clamp(var(--blora-space-7), 5vw, var(--blora-space-12));
        --blora-sidebar-sticky-offset: var(--showcase-navbar-offset);
        --blora-sidebar-sticky-height: calc(
          100dvh - var(--showcase-navbar-offset) - var(--blora-space-5)
        );
        --blora-sidebar-drawer-aside-padding: var(--blora-space-5);
        --blora-sidebar-drawer-content-padding: var(--blora-space-4) var(--blora-space-5)
          var(--blora-space-10);
        --blora-sidebar-toggle-min-height: 2.75rem;

        width: min(90rem, calc(100% - var(--blora-space-8)));
        margin: var(--blora-space-6) auto var(--blora-space-12);
      }

      #component-sidebar {
        overflow-anchor: none;
      }

      .showcase-sidebar-title {
        margin: 0;
      }

      .showcase-sidebar-title {
        padding: var(--blora-space-3) var(--blora-space-3) var(--blora-space-5);
        color: var(--blora-color-text-muted);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-sm);
        font-weight: 600;
      }

      /* Do not delay `display: none` — outgoing pages must leave the flow. */
      .showcase-panel {
        display: none;
      }

      .showcase-panel[data-active] {
        display: block;
        animation: showcase-panel-enter var(--blora-duration-base) var(--blora-easing-standard);
      }

      @keyframes showcase-panel-enter {
        from {
          opacity: 0;
        }
      }

      .showcase-preview-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--blora-space-4);
      }

      .showcase-textfx-list {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--blora-space-3);
      }

      .showcase-textfx-item {
        width: 100%;
        min-height: 3.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        background: var(--blora-color-surface-raised);
        padding: var(--blora-space-3) var(--blora-space-4);
      }

      .showcase-textfx-item blora-text-fx {
        font-size: 19px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--blora-color-text-emphasis);
      }

      .showcase-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: var(--blora-space-6);
        padding: var(--blora-space-7) 0 var(--blora-space-8);
        border-bottom: 1px solid var(--blora-color-border-subtle);
      }

      .showcase-heading__eyebrow {
        margin: 0 0 var(--blora-space-2);
        color: var(--blora-color-action-primary-default);
        font-family: var(--blora-font-mono);
        font-size: var(--blora-text-xs);
        font-weight: 600;
        letter-spacing: var(--blora-tracking-caps);
        text-transform: uppercase;
      }

      .showcase-heading h1 {
        width: fit-content;
        max-width: 100%;
        margin: 0;
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: clamp(var(--blora-text-3xl), 4vw, var(--blora-text-4xl));
        line-height: var(--blora-leading-tight);
      }

      .showcase-heading h1:focus-visible {
        margin: calc(-1 * var(--blora-space-1)) calc(-1 * var(--blora-space-2));
        padding: var(--blora-space-1) var(--blora-space-2);
        border-radius: var(--blora-radius-sm);
        outline: var(--blora-focus-ring-width-strong) solid
          var(--blora-color-action-primary-default);
        outline-offset: var(--blora-space-1);
        box-shadow: none;
      }

      .showcase-heading__description {
        max-width: 42rem;
        margin: var(--blora-space-3) 0 0;
        color: var(--blora-color-text-muted);
        line-height: var(--blora-leading-loose);
      }

      .showcase-heading > .blora-badge {
        width: max-content;
        min-width: max-content;
        height: auto;
        padding: 0.2em 0.7em;
        aspect-ratio: auto;
        border-radius: var(--blora-radius-full);
      }

      .showcase-section {
        padding-block: var(--blora-space-9);
      }

      .showcase-section + .showcase-section {
        border-top: 1px solid var(--blora-color-border-subtle);
      }

      .showcase-section > h2 {
        margin: 0 0 var(--blora-space-4);
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-xl);
      }

      .showcase-example {
        overflow: clip;
        background: var(--blora-color-surface-default);
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        box-shadow: var(--blora-shadow-1);
      }

      .showcase-example:has(blora-palette-picker[data-open]) {
        overflow: visible;
      }

      .showcase-preview,
      .showcase-code-panel {
        padding: clamp(var(--blora-space-5), 4vw, var(--blora-space-8));
        background: var(--blora-color-surface-canvas);
      }

      .showcase-preview {
        display: grid;
        min-height: 12rem;
        place-items: start center;
      }

      .showcase-preview > * {
        width: min(40rem, 100%);
        min-width: 0;
      }

      /* Intrinsically sized demos keep their own width; forcing the 40rem
         column onto them stretched lone buttons and detached avatar badges. */
      .showcase-preview
        > :is(
          button,
          a,
          .blora-avatar-wrap,
          .blora-indicator,
          .blora-badge,
          .blora-tag,
          blora-popconfirm,
          blora-popover,
          blora-tooltip,
          blora-dropdown,
          blora-switch,
          blora-checkbox,
          blora-radio,
          blora-swap,
          blora-rate
        ) {
        width: max-content;
        max-width: 100%;
      }

      /* Demo rows sit in the middle of the preview instead of hugging the
         start edge of a centred column. */
      .showcase-preview [data-showcase-row] {
        justify-content: center;
      }

      .showcase-preview [data-showcase-row]:has(> blora-switch) {
        gap: var(--blora-space-6);
      }

      .showcase-preview:has(> [data-showcase-pattern]) {
        place-items: start stretch;
      }

      .showcase-preview > [data-showcase-pattern] {
        width: 100%;
      }

      .showcase-preview:has([data-showcase-addon-layout]) {
        place-items: start stretch;
      }

      .showcase-preview > [data-showcase-addon-layout] {
        width: 100%;
      }

      .showcase-preview:has([data-showcase-addon-thread]) {
        place-items: start stretch;
      }

      .showcase-preview > [data-showcase-addon-thread],
      .showcase-preview > blora-thread-comment,
      .showcase-preview > blora-thread-composer {
        width: min(48rem, 100%);
      }

      [data-showcase-row] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--blora-space-3);
      }

      [data-showcase-stack] {
        display: grid;
        gap: var(--blora-space-4);
      }

      [data-showcase-center] {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--blora-space-4);
      }

      [data-showcase-grid] {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: var(--blora-space-4);
      }

      [data-showcase-grid][data-showcase-grid-wide] {
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
      }

      [data-showcase-mockup-stage] {
        display: grid;
        justify-items: center;
        min-width: 0;
        padding: var(--blora-space-6);
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
        background: var(--blora-color-surface-raised);
      }

      [data-showcase-mockup-stage] > blora-mockup:not([variant="phone"]) {
        width: 100%;
      }

      [data-showcase-mockup-stage] > blora-mockup[variant="phone"] {
        width: min(100%, 15.5rem);
      }

      [data-showcase-cases] {
        display: grid;
        gap: var(--blora-space-8);
        width: 100%;
      }

      [data-showcase-case] {
        display: grid;
        gap: var(--blora-space-4);
        min-width: 0;
      }

      [data-showcase-case] > h3 {
        margin: 0;
        color: var(--blora-color-text-primary);
        font-family: var(--blora-font-heading);
        font-size: var(--blora-text-md);
      }

      [data-showcase-case="WithBadge"] {
        justify-items: start;
      }

      .showcase-fx-surface,
      [data-showcase-effect-surface] {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, var(--blora-color-action-primary-default), var(--blora-color-status-info));
      }

      .showcase-fx-surface[data-tone="success"],
      [data-showcase-effect-surface="success"] {
        background: linear-gradient(135deg, var(--blora-color-status-success), var(--blora-color-surface-sunken));
      }

      .showcase-fx-surface[data-tone="info"],
      [data-showcase-effect-surface="info"] {
        background: linear-gradient(135deg, var(--blora-color-status-info), var(--blora-color-status-warning));
      }

      [data-showcase-image-diff],
      [data-showcase-hover-gallery] {
        width: min(28rem, 100%);
      }

      [data-showcase-anchor-layout] {
        display: grid;
        grid-template-columns: 9rem minmax(0, 1fr);
        gap: var(--blora-space-6);
        align-items: start;
      }

      [data-showcase-anchor] {
        position: sticky;
        top: var(--blora-space-4);
      }

      [data-showcase-anchor-content] {
        max-height: 22rem;
        overflow: auto;
      }

      [data-showcase-anchor-content] > section {
        min-height: 18rem;
        scroll-margin-top: var(--blora-space-4);
      }

      [data-showcase-overlay-space] {
        min-height: 18rem;
      }

      [data-showcase-drawer-stage] {
        position: relative;
        min-height: 20rem;
        overflow: hidden;
        border: 1px solid var(--blora-color-border-subtle);
        border-radius: var(--blora-radius-lg);
      }

      [data-showcase-drawer-stage] > .blora-button {
        margin: var(--blora-space-4);
      }

      [data-showcase-mentions-stage] {
        min-height: 19rem;
        padding-bottom: 14rem;
      }

      [data-showcase-slide] {
        display: grid;
        min-height: 12rem;
        place-items: center;
        padding: var(--blora-space-6);
        color: var(--blora-color-text-primary);
        background: var(--blora-color-surface-raised);
      }

      .showcase-deck-card {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--blora-space-2);
        padding: var(--blora-space-5);
        box-sizing: border-box;
      }

      .showcase-deck-card > p {
        margin: 0;
      }

      [data-showcase-tile] {
        break-inside: avoid;
        margin-block-end: var(--blora-space-3);
        padding: var(--blora-space-4);
        color: var(--blora-color-text-primary);
        background: var(--blora-color-surface-raised);
        border-radius: var(--blora-radius-md);
      }

      [data-showcase-service] {
        display: grid;
        gap: var(--blora-space-3);
        justify-items: start;
      }

      @media (max-width: 900px) {
        :root {
          --showcase-navbar-offset: 5.5rem;
        }

        .showcase-catalog {
          width: min(calc(100% - var(--blora-space-6)), 58rem);
        }

        .showcase-heading {
          grid-template-columns: 1fr;
          align-items: start;
          padding-block-start: var(--blora-space-6);
        }
      }

      @media (max-width: 560px) {
        .showcase-preview,
        .showcase-code-panel {
          padding: var(--blora-space-4);
        }

        [data-showcase-anchor-layout] {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="blora-page blora-scope">

                  <p>在一个活跃的论坛中，讨论会随着回复不断积累。长评论应当保持可读性，但不应该在时间线中占据过多垂直空间。</p>
                  <p>因此 Thread 会在渲染后测量正文高度：只有超过阈值的评论才会自动折叠，短评论不会生成任何多余控件。</p>
                  <p>折叠后的底部使用透明渐隐提示内容仍有后续，展开按钮浮在渐隐边缘；展开和收起时正文高度会平滑过渡。</p>
                  <div slot="reactions">
                    <button type="button" data-blora-thread-react aria-label="添加表情" title="表情"><span data-ic="smile" data-ic-size="16"></span></button>
                  </div>
                </blora-thread-comment>
              </blora-timeline-item>

                <button type="button" aria-label="斜体" title="斜体"><span data-ic="italic" data-ic-size="16"></span></button>
                <button type="button" aria-label="行内代码" title="行内代码"><span data-ic="code" data-ic-size="16"></span></button>

                <button type="button" aria-label="提及用户" title="提及用户"><span data-ic="at-sign" data-ic-size="16"></span></button>
                <button type="button" aria-label="表情" title="表情"><span data-ic="smile" data-ic-size="16"></span></button>
                <button type="button" aria-label="图片" title="图片"><span data-ic="image" data-ic-size="16"></span></button>
              </div>
              <textarea placeholder="撰写评论... 支持 Markdown，可 @ 提及用户"></textarea>
              <div slot="preview" class="blora-text-muted">预览内容由消费者或 Markdown add-on 渲染。</div>
              <div slot="actions">
                <button type="button" class="blora-button" data-variant="primary" data-size="sm">发表评论</button>
                <button type="button" class="blora-button" data-variant="outline" data-size="sm">定时发送</button>

    <script src="../../packages/blora-design/dist/blora.global.js"></script>
    <script src="../../packages/blora-design/dist/icons-full.global.js"></script>
    <script src="../../addons/theming/dist/theming.global.js"></script>
    <script src="../../addons/layout/dist/layout.global.js"></script>
    <script src="../../addons/effects/dist/effects.global.js"></script>
    <script src="../../addons/markdown/dist/markdown.global.js"></script>
    <script src="../../addons/qrcode/dist/qrcode.global.js"></script>
    <script src="../../addons/thread/dist/thread.global.js"></script>
    <script>
      (() => {
        const Blora = window.Blora;
        if (!Blora) {
          console.error("[showcase-v2] window.Blora missing — run the full package build");
          return;
        }
        const root = document.documentElement;
        /* pushState clones the live scroll offset onto the new entry and the
           browser restores it, pinning short pages at the old offset. */
        try {
          history.scrollRestoration = "manual";
        } catch {
          /* older engines */
        }
        const showcaseShell = document.getElementById("showcase-shell");
        const componentNavigationMount = document.getElementById("component-navigation-mount");
        const componentPanelRoot = document.getElementById("component-panel-root");
        const sourceTemplates = [
          ...document.querySelectorAll(
            "#showcase-component-sources template:is([data-component], [data-addon], [data-pattern])",
          ),
        ];
        sourceTemplates.forEach((template) => {
          if (!template.dataset.component) {
            template.dataset.component = template.dataset.addon || template.dataset.pattern;
          }
        });
        const voidElements = new Set(["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "source", "track", "wbr"]);
        const sourceScripts = {
          form: [
            'import { createFormController } from "@bloret-crew/blora-design";',
            'createFormController(document.querySelector("[data-blora-form]"));',
          ],
          table: [
            'import { createTableController } from "@bloret-crew/blora-design";',
            'document.querySelectorAll(".blora-table-wrap").forEach((root) => {',
            "  createTableController(root);",
            "});",
          ],
          message: [
            'import { createMessageElement, message } from "@bloret-crew/blora-design";',
            "",
            "document.querySelector(\"#message-variants\").append(",
            '  createMessageElement({ content: "这是一条提示消息", type: "info" }),',
            '  createMessageElement({ content: "操作已成功完成", type: "success" }),',
            '  createMessageElement({ content: "请关注重要提示", type: "warning" }),',
            '  createMessageElement({ content: "系统遇到了问题", type: "danger" }),',
            ");",
            "",
            'message.success("操作成功");',
            'message.info("这是一条提示");',
            'message.warning("请注意");',
            'message.error("出错了");',
          ],
          notification: [
            'import { createNotificationElement, createNotificationController, notify } from "@bloret-crew/blora-design";',
            "",
            "const cards = [",
            '  { type: "info", title: "新版本可用", description: "Blora Design 2.0 已准备就绪。" },',
            '  { type: "success", title: "保存成功", description: "文档已保存至云端。" },',
            '  { type: "warning", title: "存储空间不足", description: "剩余空间不足 1GB。" },',
            '  { type: "danger", title: "同步失败", description: "请检查网络后重试。" },',
            "].map((options) => createNotificationElement(options));",
            'document.querySelector("#notification-variants").append(...cards);',
            "cards.forEach((card) => createNotificationController(card));",
            "",
            'notify({ title: "保存成功", description: "文档已保存至云端。", placement: "top-right" });',
          ],
          effects: [
            'import "@bloret-crew/blora-design-effects/effects.css";',
            'import "@bloret-crew/blora-design-effects";',
            "",
            'initShortcutHints(document);',
          ],
          layout: [
            'import "@bloret-crew/blora-design-layout/layout.css";',
            'import { createAffixController, createAnchorController, initSmoothScroll } from "@bloret-crew/blora-design-layout";',
            "",
            'createAffixController(document.querySelector(".blora-affix"));',
            'createAnchorController(document.querySelector(".blora-anchor"));',
            "initSmoothScroll();",
          ],
          markdown: [
            'import "@bloret-crew/blora-design-markdown/markdown.css";',
            'import { renderMarkdownTo } from "@bloret-crew/blora-design-markdown";',
            "",
            'const host = document.querySelector("[data-blora-markdown]");',
            'const source = host.querySelector("script[type=\'text/markdown\']").textContent;',
            "renderMarkdownTo(host, source);",
          ],
          qrcode: [
            'import "@bloret-crew/blora-design-qrcode";',
            "",
            "/* <blora-qrcode value=\"…\" size=\"180\" label=\"…\"> renders on connect. */",
          ],
          theming: [
            'import "@bloret-crew/blora-design-theming/theming.css";',
            'import { bootThemeFromStorage } from "@bloret-crew/blora-design-theming";',
            "",
            "bootThemeFromStorage();",
          ],
          thread: [
            'import "@bloret-crew/blora-design-thread/thread.css";',
            'import "@bloret-crew/blora-design-thread";',
          ],
        };

        function escapeAttribute(value) {
          return value.replaceAll("&", "&amp;").replaceAll('"', "&quot;");
        }

        function isShowcaseChrome(node) {
          if (!(node instanceof Element)) return false;
          const attributes = [...node.attributes];
          return attributes.length > 0 && attributes.every((attribute) => attribute.name.startsWith("data-showcase-"));
        }

        function serializeNode(node, depth = 0) {
          const indent = "  ".repeat(depth);
          if (node.nodeType === Node.COMMENT_NODE) {
            const text = (node.textContent || "").trim();
            return text ? [`${indent}<!-- ${text} -->`] : [];
          }
          if (node.nodeType === Node.TEXT_NODE) {
            const raw = node.textContent ?? "";
            if (!raw.trim()) return [];
            return raw.replaceAll("\r\n", "\n").split("\n").map((line) => `${indent}${line.trimEnd()}`);
          }
          if (!(node instanceof Element)) return [];
          if (isShowcaseChrome(node)) {
            return [...node.childNodes].flatMap((child) => serializeNode(child, depth));
          }
          const tag = node.localName;
          const attributes = [...node.attributes]
            .filter((attribute) => !attribute.name.startsWith("data-showcase-"))
            .map((attribute) =>
              attribute.value === ""
                ? attribute.name
                : `${attribute.name}="${escapeAttribute(attribute.value)}"`,
            );
          const inline = `${indent}<${tag}${attributes.length ? ` ${attributes.join(" ")}` : ""}`;
          const pretty = attributes.length > 1 && inline.length > 88;
          const open = pretty
            ? [
                `${indent}<${tag}`,
                ...attributes.map((attribute, index) => {
                  const suffix = index === attributes.length - 1 ? ">" : "";
                  return `${indent}  ${attribute}${suffix}`;
                }),
              ]
            : [`${inline}>`];
          if (voidElements.has(tag)) return open;
          const childDepth = tag === "script" || tag === "style" ? 0 : depth + 1;
          const children = [...node.childNodes].flatMap((child) => serializeNode(child, childDepth));
          if (children.length === 0) {
            if (!pretty) return [`${inline}></${tag}>`];
            const last = open[open.length - 1];
            open[open.length - 1] = `${last.slice(0, -1)}></${tag}>`;
            return open;
          }
          const textOnly = node.children.length === 0;
          const singleLineText =
            !pretty && textOnly && children.length === 1 && !String(node.textContent || "").includes("\n");
          if (singleLineText) return [`${inline}>${children[0].trim()}</${tag}>`];
          return [...open, ...children, `${indent}</${tag}>`];
        }

        function sourceLines(template) {
          const lines = [...template.content.childNodes].flatMap((node) => serializeNode(node));
          const extra = sourceScripts[template.dataset.component];
          if (extra?.length) {
            if (lines.length) lines.push("");
            lines.push(...extra);
          }
          return lines;
        }

        function caseHeading(section) {
          return section.querySelector(":scope > h3")?.textContent.trim() || "";
        }

        function caseBodyNodes(section) {
          const heading = section.querySelector(":scope > h3");
          return [...section.childNodes].filter((node) => node !== heading);
        }

        function collectCases(template) {
          const cases = [...template.content.querySelectorAll("[data-showcase-case]")];
          if (cases.length <= 1) {
            return [
              {
                id: cases[0]?.getAttribute("data-showcase-case") || "basic",
                title: "基础用法",
                whole: true,
              },
            ];
          }
          return cases.map((section) => ({
            id: section.getAttribute("data-showcase-case") || "case",
            title: caseHeading(section) || section.getAttribute("data-showcase-case"),
            section,
            whole: false,
          }));
        }

        function linesForDemo(template, demo, isFirst) {
          if (demo.whole) return sourceLines(template);
          const lines = caseBodyNodes(demo.section).flatMap((node) => serializeNode(node));
          const extra = isFirst ? sourceScripts[template.dataset.component] : null;
          if (extra?.length) {
            if (lines.length) lines.push("");
            lines.push(...extra);
          }
          return lines;
        }

        function createExample(name, caseId, lines) {
          const example = createElement("div", {
            class: "showcase-example",
            "data-example": name,
            "data-case": caseId,
          });
          const tabs = createElement("blora-tabs", { flush: "" });
          const previewTab = createElement("blora-tab", {
            label: "Preview",
            value: "preview",
            selected: "",
          });
          previewTab.append(
            createElement("div", {
              class: "showcase-preview",
              id: `${name}-${caseId}-preview`,
              "data-preview-mount": name,
              "data-case": caseId,
            }),
          );
          const codeTab = createElement("blora-tab", { label: "HTML", value: "html" });
          const codePanel = createElement("div", { class: "showcase-code-panel" });
          const mockup = createElement("blora-mockup", {
            id: `${name}-${caseId}-code`,
            variant: "code",
            label: `${name} ${caseId} HTML 示例`,
          });
          for (const line of lines) {
            mockup.append(createElement("blora-mockup-line", {}, line));
          }
          codePanel.append(mockup);
          codeTab.append(codePanel);
          tabs.append(previewTab, codeTab);
          example.append(tabs);
          return example;
        }

        function createElement(tag, attributes = {}, text = "") {
          const element = document.createElement(tag);
          for (const [name, value] of Object.entries(attributes)) {
            if (value !== undefined && value !== null) element.setAttribute(name, value);
          }
          if (text) element.textContent = text;
          return element;
        }

        function badgeVariant(kind) {
          if (kind.includes("CE")) return "success";
          if (kind === "Headless" || kind === "Service") return "info";
          return "neutral";
        }

        function revealCurrentNavigation(attempt = 0) {
          const componentSidebar = document.getElementById("component-sidebar");
          const current = componentNavigation.querySelector('[aria-current="page"]');
          if (
            !componentSidebar ||
            componentSidebar.localName !== "aside" ||
            !componentSidebar.contains(componentNavigation) ||
            !current
          ) {
            if (attempt < 60) {
              setTimeout(() => revealCurrentNavigation(attempt + 1), 50);
            }
            return;
          }
          const sidebarRect = componentSidebar.getBoundingClientRect();
          const currentRect = current.getBoundingClientRect();
          if (sidebarRect.height === 0) {
            if (attempt < 60) {
              setTimeout(() => revealCurrentNavigation(attempt + 1), 50);
            }
            return;
          }
          componentSidebar.scrollTop +=
            currentRect.top -
            sidebarRect.top -
            (sidebarRect.height - currentRect.height) / 2;
        }

        const componentNavigation = createElement("blora-sidebar-nav", {
          id: "component-navigation",
          label: "组件导航",
          value: "button",
        });

        /* Page patterns are compositions, not a taxonomy category; list them first. */
        const leadingGroups = ["页面范式"];
        const groupOrder = ["操作", "数据展示", "导航", "反馈", "数据输入", "布局", "样机"];
        const groupRank = (label) =>
          leadingGroups.includes(label) ? 0 : groupOrder.indexOf(label) + 1 || 99;
        const groups = new Map();
        for (const template of sourceTemplates) {
          const group = template.dataset.group;
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push(template);
        }

        for (const label of [...groups.keys()].sort(
          (left, right) => groupRank(left) - groupRank(right),
        )) {
          const templates = groups.get(label);
          const group = createElement("blora-sidebar-nav-group", { label });
          for (const template of templates) {
            group.append(
              createElement("blora-sidebar-nav-link", {
                label: template.dataset.label,
                href: `#${template.dataset.component}`,
                value: template.dataset.component,
              }),
            );
          }
          componentNavigation.append(group);
        }
        componentNavigationMount.replaceWith(componentNavigation);

        for (const template of sourceTemplates) {
          const name = template.dataset.component;
          const article = createElement("article", {
            class: "showcase-panel",
            id: `panel-${name}`,
            "data-component-panel": name,
          });
          if (name === "button") article.setAttribute("data-active", "");

          const heading = createElement("header", { class: "showcase-heading" });
          const headingCopy = createElement("div");
          headingCopy.append(
            createElement("p", { class: "showcase-heading__eyebrow" }, template.dataset.eyebrow),
            createElement("h1", { tabindex: "-1" }, template.dataset.label),
            createElement(
              "p",
              { class: "showcase-heading__description" },
              template.dataset.description,
            ),
          );
          heading.append(
            headingCopy,
            createElement(
              "span",
              {
                class: "blora-badge",
                "data-variant": badgeVariant(template.dataset.kind),
                "data-shape": "pill",
              },
              template.dataset.kind,
            ),
          );
          article.append(heading);

          const demos = collectCases(template);
          demos.forEach((demo, index) => {
            const titleId = `${name}-${demo.id}-title`;
            const section = createElement("section", {
              class: "showcase-section",
              "aria-labelledby": titleId,
            });
            section.append(
              createElement("h2", { id: titleId }, demo.title),
              createExample(name, demo.id, linesForDemo(template, demo, index === 0)),
            );
            article.append(section);
          });
          componentPanelRoot.append(article);
        }

        Blora.autoDefine();

        const componentPanels = [...document.querySelectorAll("[data-component-panel]")];
        const componentNames = new Set(componentPanels.map((panel) => panel.dataset.componentPanel));

        function isViewportOverlay(element) {
          const tag = element.localName;
          if (tag === "blora-dialog" || tag === "blora-drawer") return true;
          const style = getComputedStyle(element);
          if (style.position !== "fixed") return false;
          const rect = element.getBoundingClientRect();
          return rect.width >= innerWidth * 0.85 && rect.height >= innerHeight * 0.85;
        }

        function isScrollport(style) {
          return /auto|scroll|hidden|clip/.test(`${style.overflowX}${style.overflowY}`);
        }

        /* Overflow content (virtual table pads, lists) must not stretch the
           Preview past the visible scrollport. Anchored menus stay outside
           any scrollport, so they still enlarge the card. */
        function visibleBottom(element, mount) {
          let bottom = element.getBoundingClientRect().bottom;
          for (let node = element.parentElement; node && node !== mount; node = node.parentElement) {
            if (isScrollport(getComputedStyle(node))) {
              bottom = Math.min(bottom, node.getBoundingClientRect().bottom);
            }
          }
          return bottom;
        }

        function bindPreviewResize(mount) {
          const resizePreview = () => {
            const previewRect = mount.getBoundingClientRect();
            let requiredBottom = previewRect.top;
            for (const element of mount.querySelectorAll("*")) {
              const style = getComputedStyle(element);
              if (style.display === "none" || style.visibility === "hidden") continue;
              if (isViewportOverlay(element)) continue;
              requiredBottom = Math.max(requiredBottom, visibleBottom(element, mount));
            }
            const blockPadding = parseFloat(getComputedStyle(mount).paddingBottom) || 0;
            mount.style.minHeight = `${Math.max(192, Math.ceil(requiredBottom - previewRect.top + blockPadding))}px`;
          };
          const schedulePreviewResize = () => requestAnimationFrame(() => requestAnimationFrame(resizePreview));
          new ResizeObserver(schedulePreviewResize).observe(mount);
          new MutationObserver(schedulePreviewResize).observe(mount, {
            attributes: true,
            childList: true,
            subtree: true,
          });
          mount.addEventListener("click", schedulePreviewResize);
          mount.addEventListener("input", schedulePreviewResize);
          mount.addEventListener("transitionend", schedulePreviewResize);
          schedulePreviewResize();
        }

        function hydrateMount(name, mount, source, demo) {
          if (demo.whole) mount.append(source.content.cloneNode(true));
          else {
            const fragment = document.createDocumentFragment();
            for (const node of caseBodyNodes(demo.section)) fragment.append(node.cloneNode(true));
            mount.append(fragment);
          }
          mount.querySelectorAll("[data-showcase-icon]").forEach((host) => {
            host.replaceChildren(Blora.createBloraIcon(host.dataset.showcaseIcon, 22));
          });
          if (typeof Blora.enhanceButtons === "function") Blora.enhanceButtons(mount);
          if (typeof Blora.enhanceBadges === "function") Blora.enhanceBadges(mount);
          bindPreviewResize(mount);

          const messageTarget = mount.querySelector('[data-showcase-service="message"]');
          if (messageTarget) {
            messageTarget.append(
              Blora.createMessageElement({ content: "这是一条提示消息", type: "info" }),
              Blora.createMessageElement({ content: "操作已成功完成", type: "success" }),
              Blora.createMessageElement({ content: "请关注重要提示", type: "warning" }),
              Blora.createMessageElement({ content: "系统遇到了问题", type: "danger" }),
            );
          }
          const notificationTarget = mount.querySelector(
            '[data-showcase-service="notification"]',
          );
          if (notificationTarget) {
            const cards = [
              { type: "info", title: "新版本可用", description: "Blora Design 2.0 已准备就绪。" },
              { type: "success", title: "保存成功", description: "文档已保存至云端。" },
              { type: "warning", title: "存储空间不足", description: "剩余空间不足 1GB。" },
              { type: "danger", title: "同步失败", description: "请检查网络后重试。" },
            ].map((options) => Blora.createNotificationElement(options));
            notificationTarget.append(...cards);
            cards.forEach((card) => Blora.createNotificationController(card));
          }
          mount.querySelectorAll("[data-showcase-table]").forEach((table) => {
            const controller = Blora.createTableController(table);
            if (table.dataset.showcaseVirtual === "y") {
              controller.setRows(
                Array.from({ length: 500 }, (_, index) => [
                  `User ${index + 1}`,
                  index % 3 === 0 ? "Admin" : index % 3 === 1 ? "Editor" : "Guest",
                  index % 2 === 0 ? "Active" : "Offline",
                ]),
              );
            }
            if (table.dataset.showcaseVirtual === "both") {
              const keys = Array.from({ length: 40 }, (_, index) => `c${index}`);
              controller.setRows(
                Array.from({ length: 300 }, (_, rowIndex) =>
                  Object.fromEntries(keys.map((key, columnIndex) => [key, `R${rowIndex + 1}C${columnIndex + 1}`])),
                ),
                keys,
              );
            }
          });
          mount.querySelectorAll("[data-showcase-form]").forEach((form) => {
            Blora.createFormController(form);
            form.addEventListener("submit", (event) => event.preventDefault());
          });
          if (name === "effects") {
            /* text-fx / rotate / countdown / countup / diff / gallery /
               watermark are composite CEs and self-mount on connect. */
            window.BloraEffects.initShortcutHints(mount);
          }
          if (name === "layout") {
            window.BloraLayout.initSmoothScroll(mount.ownerDocument);
          }
          if (name === "markdown") {
            /* <blora-markdown> renders itself on connect. */
          }
          if (name === "qrcode") {
            /* <blora-qrcode> renders itself on connect. */
          }
          if (name === "thread") {
            mount.querySelectorAll("[data-ic]").forEach((host) => {
              if (host.querySelector("svg") || typeof Blora.createBloraIcon !== "function") return;
              host.replaceChildren(Blora.createBloraIcon(host.dataset.ic, Number(host.dataset.icSize || 16)));
            });
          }
        }

        function hydratePanel(name) {
          const panel = document.querySelector(`[data-component-panel="${name}"]`);
          if (!panel || panel.dataset.hydrated === "true") return;
          const source = sourceTemplates.find((template) => template.dataset.component === name);
          for (const demo of collectCases(source)) {
            const mount = panel.querySelector(
              `[data-preview-mount="${name}"][data-case="${CSS.escape(demo.id)}"]`,
            );
            if (mount) hydrateMount(name, mount, source, demo);
          }
          panel.dataset.hydrated = "true";
        }

        function syncTheme() {
          const canvas = getComputedStyle(document.body).getPropertyValue("--blora-color-surface-canvas").trim();
          document.querySelector('meta[name="theme-color"]').setAttribute("content", canvas);
        }

        let preservedSidebarScrollTop = null;
        let navigationWasPointerDriven = false;

        function selectComponent(name, { focusHeading = false } = {}) {
          const next = componentNames.has(name) ? name : "button";
          const componentSidebar = document.getElementById("component-sidebar");
          const sidebarScrollTop = preservedSidebarScrollTop ?? componentSidebar?.scrollTop ?? 0;
          preservedSidebarScrollTop = null;
          const restoreSidebarScroll = () => {
            if (componentSidebar) componentSidebar.scrollTop = sidebarScrollTop;
          };
          hydratePanel(next);
          componentNavigation.value = next;
          restoreSidebarScroll();
          queueMicrotask(restoreSidebarScroll);
          requestAnimationFrame(restoreSidebarScroll);
          componentPanels.forEach((panel) => {
            panel.toggleAttribute("data-active", panel.dataset.componentPanel === next);
          });
          /* A shorter page must not inherit the previous scroll offset. The
             synchronous scroll event updates the sticky sidebar's remembered
             offset before its mutation observer can force the old one back. */
          if (window.scrollY > 0) {
            window.scrollTo({ top: 0, behavior: "instant" });
            window.dispatchEvent(new Event("scroll"));
          }
          const activePanel = document.querySelector(`[data-component-panel="${next}"]`);
          const title = activePanel.querySelector("h1");
          document.title = `${title.textContent} · Blora Design Components`;
          if (focusHeading) title.focus({ preventScroll: true });
        }

        componentPanelRoot.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-showcase-action]");
          if (!trigger) return;
          const panel = trigger.closest("[data-component-panel]");
          const action = trigger.dataset.showcaseAction;
          const target = trigger.dataset.showcaseTarget
            ? panel.querySelector(`#${CSS.escape(trigger.dataset.showcaseTarget)}`)
            : null;
          if (action === "dialog") (target ?? panel.querySelector("blora-dialog"))?.show();
          if (action === "command") (target ?? panel.querySelector("blora-command[data-overlay]"))?.show();
          if (action === "drawer") (target ?? panel.querySelector("blora-drawer"))?.open();
          if (action === "message") {
            const type = trigger.dataset.showcaseMessage;
            const content = {
              success: "操作成功",
              info: "这是一条提示",
              warning: "请注意",
              error: "出错了",
            }[type];
            Blora.message[type](content);
          }
          if (action === "close-overlay") trigger.closest("blora-dialog")?.close();
        });

        root.addEventListener("blora-theme-change", syncTheme);
        root.addEventListener("blora-color-scheme-change", syncTheme);

      componentNavigation.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        if (!event.target.closest('a[href^="#"]')) return;
        event.preventDefault();
          navigationWasPointerDriven = true;
          preservedSidebarScrollTop = document.getElementById("component-sidebar")?.scrollTop ?? 0;
        }, true);
        /* The nav owns routing; a native fragment jump would re-scroll after
           the panel swap and pin short pages at the old offset. Links live
           inside the nav item shadow roots, so match via composedPath(). */
        const resetWindowScroll = () => {
          if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: "instant" });
        };
        document.addEventListener(
          "click",
          (event) => {
            const anchor = event
              .composedPath()
              .find((node) => node instanceof Element && node.matches?.('a[href^="#"]'));
            if (anchor && componentNavigation.contains(anchor)) event.preventDefault();
          },
          true,
        );
        componentNavigation.addEventListener("blora-change", (event) => {
          history.pushState(null, "", `#${event.detail.value}`);
          selectComponent(event.detail.value, { focusHeading: !navigationWasPointerDriven });
          requestAnimationFrame(resetWindowScroll);
          navigationWasPointerDriven = false;
        });
        new MutationObserver(() => {
          if (showcaseShell.hasAttribute("data-open")) {
            requestAnimationFrame(() => revealCurrentNavigation());
          }
        }).observe(showcaseShell, { attributeFilter: ["data-open"] });
        addEventListener("hashchange", () => selectComponent(location.hash.slice(1)));

        syncTheme();
        selectComponent(location.hash.slice(1));
        requestAnimationFrame(() => revealCurrentNavigation());
      })();
    </script>
  </body>
</html>
