name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安装 Playwright 的 Chromium
        run: pnpm exec playwright install --with-deps chromium
      # 构建 → 代码检查（JS、CSS、DESIGN.md、格式）→ 类型检查 → 单元测试 → 浏览器测试（与参考页比对、运行时行为）
      - run: pnpm verify
      - name: 失败时上传浏览器测试结果
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
